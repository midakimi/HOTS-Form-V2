<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบบันทึกการนิเทศเพื่อพัฒนาสมรรถนะการจัดการเรียนรู้สำหรับครูโรงเรียนเอกชนในระบบ - กลุ่มพัฒนาคุณภาพและมาตรฐานการศึกษา สำนักงานการศึกษาเอกชนจังหวัดนราธิวาส</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12303a;--mute:#5b727a;--sea:#0e5a6b;--sea2:#0a3f4c;--sun:#e8a317;--bg:#eef4f4;--card:#fff;--line:#d3dfe1;--ok:#2f7d4f;--bad:#b3402f;--info:#2a568e;--r:12px;--sh:0 1px 2px #12303a0d,0 6px 18px #12303a0f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{background:linear-gradient(120deg,var(--sea2),var(--sea));color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:4px solid var(--sun)}
header .logo{width:42px;height:42px;border-radius:12px;background:#ffffff1f;display:grid;place-items:center;font-size:22px;flex:none}
header h1{font-size:17px;margin:0;flex:1;min-width:220px;line-height:1.35}
header small{display:block;font-weight:400;opacity:.8;font-size:13px}
.hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:right;margin-right:4px}
.who small{font-size:12px}
.bell{position:relative;background:#ffffff1f;border:1px solid #ffffff40;color:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:16px}
.bd{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;margin-left:4px}
nav{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #12303a10}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;color:var(--mute);font-weight:500}
nav button:hover{background:#eef4f4}
nav button.on{background:var(--sea);color:#fff}
main{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
h2{margin:0 0 14px;font-size:22px;color:var(--sea2)}
h3{margin:18px 0 8px;font-size:17px;color:var(--sea2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card>h3:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--sea);background:var(--sea);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#fff;color:var(--sea)}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.meet{background:#1a73e8;border-color:#1a73e8}
.btn.sm{padding:3px 10px;font-size:14px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 3px;color:var(--sea2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#fff7df,#e3f1f2);flex:none}
.kpi b{font-size:26px;line-height:1.1;color:var(--sea2);display:block}
.kpi span{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#e8f0f1;font-weight:600}
tr:hover td{background:#f8fbfb}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#e8f0f1;color:var(--sea2);white-space:nowrap}
.tag.ok{background:#dcefe3;color:var(--ok)}.tag.warn{background:#fbecc6;color:#7a5400}.tag.bad{background:#f6dcd7;color:var(--bad)}.tag.info{background:#dde8f6;color:var(--info)}.tag.done{background:#e6ebec;color:#4b5f64}
.bar{height:14px;background:#e8f0f1;border-radius:7px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--sea);border-radius:7px}
.mute{color:var(--mute);font-size:14px}
.empty{padding:28px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r);background:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{max-width:300px}
.alert{border-radius:10px;padding:10px 14px;margin:8px 0;font-size:15px}
.alert.ok{background:#dcefe3;color:#1d5a37}.alert.bad{background:#f6dcd7;color:#8a2d20}.alert.warn{background:#fff3d6;color:#6b4a00;border:1px solid #ecce80}.alert.info{background:#dde8f6;color:var(--info)}
.rub{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rub .opt{display:flex;gap:4px}
.rub .opt label{margin:0;display:flex;align-items:center;gap:4px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
.rub .opt input{width:auto}
.rbar{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.sbar{cursor:pointer;border-radius:8px;padding:4px 6px;margin:2px -6px}
.sbar:hover{background:#eef4f4}
.lg{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.appt{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.appt.s-warn{border-left-color:var(--sun)}.appt.s-ok{border-left-color:var(--ok)}.appt.s-info{border-left-color:var(--info)}.appt.s-bad{border-left-color:var(--bad);opacity:.85}.appt.s-done{border-left-color:#8aa}
.dbox{min-width:60px;text-align:center;background:#e3f1f2;border-radius:10px;padding:6px 4px;align-self:flex-start}
.dbox b{display:block;font-size:24px;line-height:1.1;color:var(--sea2)}
.dbox span{font-size:12px;color:var(--mute)}
.mini{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border:0}
.mini .dbox{min-width:50px;padding:3px}.mini .dbox b{font-size:18px}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:16px;font-weight:700;color:var(--sea2)}
details.sgrp{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
details.sgrp>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f7fafa}
details.sgrp>summary::-webkit-details-marker{display:none}
details.sgrp>summary::before{content:'▸';color:var(--sea);transition:transform .2s}
details.sgrp[open]>summary::before{transform:rotate(90deg)}
details.sgrp .in{padding:4px 14px 14px}
.trow{display:grid;grid-template-columns:2fr 1.4fr 1.2fr auto;gap:8px;margin-bottom:8px}
@media (max-width:600px){.trow{grid-template-columns:1fr 1fr}.who{display:none}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.steps div{background:#f2f8f8;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.welcome{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(135deg,#fff7df,#e3f1f2);border:2px solid var(--sun);border-radius:16px;padding:16px 20px;margin-bottom:14px}
dialog{border:0;border-radius:16px;padding:22px;width:min(780px,94vw);max-height:92vh;box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0a3f4ca0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sea2);color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:99;box-shadow:var(--sh)}
#toast.bad{background:var(--bad)}
.login{max-width:430px;margin:7vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;border-top:6px solid var(--sun);box-shadow:var(--sh)}
.login .intro{text-align:center;color:var(--mute);line-height:1.6;margin-bottom:8px}
.login h2{text-align:center;color:var(--sea2);margin-top:8px}
.seg{display:flex;border:1px solid var(--sea);border-radius:8px;overflow:hidden;margin:12px 0}
.seg button{flex:1;border:0;background:#fff;color:var(--sea);padding:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--sea);color:#fff}
.cm{border-left:3px solid var(--line);padding:2px 10px;margin:6px 0 6px 6px;font-size:15px}
footer{text-align:center;padding:24px 16px;margin-top:16px;color:#64748b;font-size:13px;border-top:1px solid #e2e8f0;line-height:1.6}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fff7df,#e3f1f2);border:2px solid var(--sun);border-radius:14px;padding:14px 18px;margin:12px 0}
.hero .em{font-size:44px;line-height:1}
.hero .stars{color:var(--sun);font-size:26px;letter-spacing:3px;line-height:1.2}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.chip{border-radius:12px;padding:10px 14px;font-size:15px}
.chip.up{background:#dcefe3;border:1px solid #a9d3b8}.chip.go{background:#fbecc6;border:1px solid #ecce80}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.nb{break-inside:avoid;page-break-inside:avoid}
.note{background:#f2f6f6;border-left:3px solid var(--sea);padding:4px 10px;margin-top:4px;font-size:14px;border-radius:0 6px 6px 0}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:26px;break-inside:avoid;page-break-inside:avoid}
.sig{text-align:center;font-size:14px;line-height:1.5}
.sig .box{height:72px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px dotted #444;margin-bottom:4px}
.sig img{max-height:68px;max-width:100%}
.pad{display:block;width:100%;aspect-ratio:3/1;border:1px dashed var(--sea);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.padbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
@page{size:A4;margin:14mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}header,nav,footer,.noprint,#toast{display:none!important}body{background:#fff}body:has(dialog[open]) #app{display:none}dialog{position:static!important;inset:auto!important;margin:0!important;box-shadow:none;width:100%;max-width:none;height:auto;max-height:none;overflow:visible;padding:0}dialog::backdrop{display:none}main{padding:0}.card,.kpi,.appt{box-shadow:none}}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-label="หน้าต่างรายละเอียด"></dialog>
<div id="toast" role="status"></div>
<footer>
  พัฒนาโดย: <strong>นางสาวฮานีดา เมาะมิง</strong><br>
  ตำแหน่งศึกษานิเทศก์ วิทยฐานะศึกษานิเทศก์ชำนาญการพิเศษ<br>
  กลุ่มงานพัฒนาคุณภาพและมาตรฐานการศึกษา สำนักงานการศึกษาเอกชนจังหวัดนราธิวาส
</footer>
<script>
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwh1UxoEBbksFJmxyYI_q97Uwit9CstoTBRt_cxyOHCdSovI-UgXsfIO0CLppuO6iwVkA/exec';
const RUBRIC = [
 'เกริ่นนำเข้าสู่บทเรียน มีการกำหนดเป้าหมายการเรียนรู้ที่ชัดเจน',
 'ตั้งคำถามเพื่อสร้างการเรียนรู้ มีการตั้งคำถามกระตุ้นการคิดขั้นสูง เช่น คิดวิเคราะห์ สังเคราะห์ ประเมินค่า และสร้างสรรค์',
 'จัดกิจกรรมให้นักเรียนลงมือคิด มีการกำหนดสถานการณ์ เชื่อมโยงเนื้อหากับสถานการณ์จริงและบริบทใกล้ตัวเพื่อแก้ปัญหา เรียนรู้ด้วยการลงมือปฏิบัติจริง และทำงานร่วมกัน',
 'เปิดโอกาสให้นักเรียนแสดงความคิดเห็น ซักถาม อภิปรายร่วมกัน อธิบายเหตุผลและใช้หลักฐานสนับสนุนความคิด',
 'ฟัง และจับประเด็นสำคัญ สรุปและสะท้อนคิดเป็นระยะ ให้นักเรียนติดตามความคิด และให้ข้อมูลป้อนกลับที่ช่วยให้ผู้เรียนคิดต่อ',
 'ลำดับความคิดและประเด็นการเรียนรู้ เพื่อนำไปสู่ข้อสรุปทั้งหมดของคาบเรียนโดยสอดคล้องกับจุดประสงค์การเรียนรู้ในแผนการจัดการเรียนรู้',
 'เชื่อมโยงความคิดเห็นของนักเรียนสู่การสรุปแนวคิดหลักของบทเรียน',
 'วัดและประเมินผลการคิดขั้นสูงอย่างเหมาะสม มีเครื่องมือและเกณฑ์การวัดผลที่สอดคล้องกับจุดประสงค์การเรียนรู้'];
const SHORT = ['เกริ่นนำและเป้าหมาย','ตั้งคำถามกระตุ้นคิด','กิจกรรมลงมือคิด','เปิดโอกาสแสดงความคิดเห็น','ฟัง สรุป สะท้อนคิด','ลำดับความคิดสู่ข้อสรุป','เชื่อมโยงสู่แนวคิดหลัก','วัดผลการคิดขั้นสูง'];
const GRADES = ['ระดับปฐมวัย', ...[1,2,3,4,5,6].map(n => 'ประถมศึกษาปีที่ ' + n), ...[1,2,3,4,5,6].map(n => 'มัธยมศึกษาปีที่ ' + n)];
const PRE = [['preGoal','เป้าหมายของคาบ'],['preFocus','ประเด็นที่ต้องการให้สังเกต'],['preNeed','สิ่งที่ต้องการให้ช่วยเหลือ']];
const SUP_NAME = 'นางสาวฮานีดา เมาะมิง', SUP_POS = 'ศึกษานิเทศก์';
const ROLE = {sup:'ศึกษานิเทศก์', head:'ผู้บริหารโรงเรียน', teacher:'ครู'};
const LVN = ['ดีเยี่ยม','ดี','พอใช้','ควรปรับปรุง'], LVC = ['#2f7d4f','#7cbf94','#e8a317','#b3402f'];
// สถานะนัดโค้ช: รอยืนยัน (ครูขอ) → ยืนยันแล้ว / เลื่อนนัด (ศน.) → เสร็จสิ้น / ยกเลิก
const STC = {'รอยืนยัน':'warn','ยืนยันแล้ว':'ok','นัดหมาย':'ok','เลื่อนนัด':'info','เสร็จสิ้น':'done','ยกเลิก':'bad'};
const BASE_TITLE = document.title;
let GAS = localStorage.getItem('gas') || DEFAULT_GAS_URL;
let S = JSON.parse(sessionStorage.getItem('s') || 'null'), D = {}, tab = '', q = '', fs = '', lastN = null;
const $ = s => document.querySelector(s);
const L = c => D[c] || [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fd = d => d ? new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}) : '-';
const fdl = d => d ? new Date(d).toLocaleDateString('th-TH', {weekday:'short', day:'numeric', month:'short', year:'2-digit'}) : '-';
const isSup = () => S && S.role === 'sup';
const isHead = () => S && S.role === 'head';
const isT = () => S && !isSup() && !isHead();
const myEv = () => 'evid/' + S.uid + '/items';
const nl = s => esc(s).replace(/\n/g, '<br>');
const mine = x => x.tuid === S.uid || String(x.teacher || '').trim() === S.name;
const tmatch = (x, t) => x.tuid === t.id || String(x.teacher || '').trim() === t.name;
const inSchool = x => String(x.school || '').trim() === S.name || L('roster').some(t => t.school === S.name && tmatch(x, t));
const canSee = x => isSup() || (isHead() ? inSchool(x) : mine(x));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const grp = (a, k) => a.reduce((m, x) => { const g = k(x); (m[g] = m[g] || []).push(x); return m; }, {});
const th = (a, b) => String(a || '').localeCompare(String(b || ''), 'th');
const schOf = x => x.school || (L('roster').find(t => tmatch(x, t)) || {}).school || '';
const schools = () => [...new Set([...L('school').map(s => s.name), ...L('roster').map(t => t.school)].filter(Boolean))].sort(th);
const myRoster = () => L('roster').find(t => t.id === S.uid) || {};

/* ---------- นัดโค้ช: เวลา/ชนกัน ---------- */
const toMin = t => { const [h, m] = String(t || '00:00').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const endT = x => { const m = toMin(x.time) + (+x.dur || 60); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const SCH_ACTIVE = x => !['เสร็จสิ้น','ยกเลิก'].includes(x.status);
const isConf = x => ['ยืนยันแล้ว','นัดหมาย','เลื่อนนัด'].includes(x.status);
const byDT = (a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || ''));
const conflicts = r => L('sched').filter(x => x.id !== r.id && SCH_ACTIVE(x) && x.date === r.date
  && toMin(x.time) < toMin(r.time) + (+r.dur || 60) && toMin(r.time) < toMin(x.time) + (+x.dur || 60));
const modeOf = x => x.mode || (/meet\.google/.test((x.meet || '') + (x.place || '')) ? 'online' : 'onsite');
const meetOf = x => x.meet || (/^https:\/\/meet\.google\.com\//.test(x.place || '') ? x.place : '');

async function api(b) {
  if (!GAS) throw Error('ยังไม่ได้ตั้งค่า URL ของ Web App');
  const r = await fetch(GAS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...b, token: S && S.token})});
  const j = await r.json();
  if (j.code === 'unauthorized') { S = null; sessionStorage.removeItem('s'); render(); }
  if (j.status !== 'success') throw Error(j.message || 'เกิดข้อผิดพลาด');
  return j;
}
async function load() {
  const j = await api({action:'list'}); D = {};
  j.appData.forEach(x => { try { (D[x.collection] = D[x.collection] || []).push(JSON.parse(x.json)); } catch (e) {} });
}
async function save(c, r) {
  r.id = r.id || uid();
  await api({action:'save', collection:c, id:r.id, record:r});
  const a = D[c] = L(c), i = a.findIndex(x => x.id === r.id);
  i < 0 ? a.push(r) : a[i] = r; return r;
}
async function del(c, id) { await api({action:'delete', collection:c, id}); D[c] = L(c).filter(x => x.id !== id); }
async function run(fn, ok) {
  try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message, true); return false; }
  return true;
}

  return {avg: +avg.toFixed(2)};
}
const lvl = a => a >= 3.5 ? ['ดีเยี่ยม','ok'] : a >= 2.5 ? ['ดี','ok'] : a >= 1.5 ? ['พอใช้','warn'] : ['ควรปรับปรุง','bad'];

const colOf = v => v >= 3.5 ? LVC[0] : v >= 2.5 ? LVC[1] : v >= 1.5 ? LVC[2] : LVC[3];

/* ---------- กราฟ Dashboard ---------- */
function donutSVG(lv, center) {
  const tot = lv.reduce((a, b) => a + b, 0), R = 54, C = 2 * Math.PI * R; let off = 0;
  const seg = lv.map((n, i) => { if (!n) return ''; const len = n / tot * C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${LVC[i]}" stroke-width="22" stroke-dasharray="${f1(len)} ${f1(C - len)}" stroke-dashoffset="${f1(-off)}" transform="rotate(-90 70 70)"/>`;
    off += len; return s; }).join('');
  return `<svg viewBox="0 0 140 140" style="width:170px;flex:none" role="img" aria-label="สัดส่วนระดับคุณภาพ"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#e8f0f1" stroke-width="22"/>${seg}
   <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#0a3f4c">${center}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="#5b727a">คะแนนเฉลี่ย</text></svg>`;
}
function monthSVG(mk) {
  const W = 420, H = 190, t = 26, b = 46, mx = Math.max(1, ...mk.map(m => m.n)), cw = (W - 20) / mk.length, bw = cw * .5;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="จำนวนครั้งการนิเทศรายเดือน"><line x1="10" x2="${W - 10}" y1="${H - b}" y2="${H - b}" stroke="#d3dfe1"/>
   ${mk.map((m, i) => { const x = 10 + cw * i + (cw - bw) / 2, h = m.n / mx * (H - t - b), y = H - b - h;
     return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(bw)}" height="${f1(h)}" rx="5" fill="#0e5a6b"/><text x="${f1(x + bw / 2)}" y="${f1(y - 6)}" text-anchor="middle" font-size="12" font-weight="700" fill="#0a3f4c">${m.n}</text>
     <text x="${f1(x + bw / 2)}" y="${H - b + 17}" text-anchor="middle" font-size="12" fill="#5b727a">${m.lab}</text>${m.n ? `<text x="${f1(x + bw / 2)}" y="${H - b + 34}" text-anchor="middle" font-size="11" font-weight="700" fill="#b07800">★${m.avg.toFixed(2)}</text>` : ''}`; }).join('')}</svg>`;
}
const spark = v => { if (v.length < 2) return ''; const W = 80, H = 22;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${v.map((a, i) => f1(2 + i * (W - 4) / (v.length - 1)) + ',' + f1(H - 2 - (Math.max(1, a) - 1) / 3 * (H - 4))).join(' ')}" fill="none" stroke="#0e5a6b" stroke-width="2" stroke-linejoin="round"/></svg>`; };
const miniAppt = x => { const d = new Date(x.date);
  return `<div class="mini"><div class="dbox"><b>${d.getDate()}</b><span>${d.toLocaleDateString('th-TH', {month:'short'})}</span></div><div class="sp"><b>${esc(x.teacher)}</b> ${stTag(x)}<div class="mute">🕘 ${esc(x.time)}–${endT(x)} น. · ${modeTxt(modeOf(x))} · ${esc(x.topic || '')}</div></div></div>`; };

  const SC = L('sched').filter(x => sup ? (!fs || schOf(x) === fs) : inSchool(x));
  const pend = SC.filter(x => x.status === 'รอยืนยัน');
  const up = SC.filter(x => isConf(x) && x.date >= today()).sort(byDT);
  const cov = T.filter(t => O.some(x => tmatch(x, t))).length;
  const avg = mean(O.map(x => x._avg || 0));
  const lv = [0, 0, 0, 0]; O.forEach(x => { const a = x._avg || 0; lv[a >= 3.5 ? 0 : a >= 2.5 ? 1 : a >= 1.5 ? 2 : 3]++; });
  const rub = RUBRIC.map((_, i) => mean(O.map(x => (x.scores || [])[i]).filter(v => v > 0)));
  const pos = rub.filter(v => v > 0), wi = pos.length ? rub.indexOf(Math.min(...pos)) : -1, bi = pos.length ? rub.indexOf(Math.max(...pos)) : -1;
  const mk = [], d0 = new Date();
  for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1), k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), a = O.filter(x => (x.date || '').startsWith(k));
    mk.push({lab: d.toLocaleDateString('th-TH', {month:'short'}), n: a.length, avg: mean(a.map(x => x._avg || 0))}); }
  const bySch = sup && !fs ? Object.entries(grp(O, x => schOf(x) || '-')).map(([s, a]) => [s, mean(a.map(x => x._avg || 0)), a.length]).sort((a, b) => b[1] - a[1]) : [];
  const rows = T.slice().sort((a, b) => th(a.school, b.school) || th(a.name, b.name)).map(t => {

    const d = l && p ? (l._avg || 0) - (p._avg || 0) : null;

     <td>${d === null ? '<span class="mute">-</span>' : d > 0.004 ? `<b style="color:var(--ok)">▲ ${d.toFixed(2)}</b>` : d < -0.004 ? `<b style="color:var(--bad)">▼ ${Math.abs(d).toFixed(2)}</b>` : '<span class="mute">● คงที่</span>'}</td>
     <td>${spark(o.slice(-6).map(x => x._avg || 0))}</td><td>${l ? `<button class="btn alt sm" data-a="vobs" data-id="${l.id}">ดู</button>` : ''}</td></tr>`;
  }).join('');
  return `<div class="row" style="margin-bottom:14px"><h2 class="sp" style="margin:0">📊 ${sup ? 'Dashboard ภาพรวมการนิเทศ' : 'Dashboard ' + esc(S.name)}</h2>${sup ? `<div style="min-width:240px">${schoolSel()}</div>` : ''}</div>
   ${sup && pend.length ? `<div class="alert warn row"><span class="sp">🔔 มีคำขอรับการโค้ชจากครูรอยืนยัน <b>${pend.length}</b> รายการ</span><button class="btn sm" data-a="goto" data-v="sched">ไปพิจารณา</button></div>` : ''}

   ${kpi('🎯', T.length ? Math.round(cov / T.length * 100) + '%' : '-', 'ครูได้รับการนิเทศ', `${cov} จาก ${T.length} คน`)}${kpi('⭐', O.length ? avg.toFixed(2) : '-', 'คะแนนเฉลี่ย (เต็ม 4)', O.length ? lvl(avg)[0] : '')}${kpi('📅', up.length, 'นัดโค้ชที่จะถึง', pend.length ? `รอยืนยัน ${pend.length}` : '')}</div>
   <div class="grid2"><div class="card"><h3>ระดับคุณภาพการจัดการเรียนรู้</h3>${O.length ? `<div class="row" style="gap:20px;justify-content:center">${donutSVG(lv, avg.toFixed(2))}<div class="lg">${LVN.map((n, i) => `<div><i style="background:${LVC[i]}"></i>${n} <b>${lv[i]}</b> <span class="mute">(${Math.round(lv[i] / O.length * 100)}%)</span></div>`).join('')}</div></div>` : '<div class="empty">ยังไม่มีผลการนิเทศ</div>'}</div>
   <div class="card"><h3>คะแนนเฉลี่ยรายประเด็น</h3>${O.length ? rub.map((v, i) => `<div class="rbar"><span>${i + 1}. ${SHORT[i]}${i === bi ? ' ⭐' : i === wi ? ' 🎯' : ''}</span><div class="bar"><i style="width:${v / 4 * 100}%;background:${colOf(v)}"></i></div><b>${v ? v.toFixed(2) : '-'}</b></div>`).join('') + '<div class="mute">⭐ จุดแข็ง · 🎯 ประเด็นที่ควรพัฒนาเป็นลำดับแรก</div>' : '<div class="empty">ยังไม่มีข้อมูล</div>'}</div></div>
   <div class="grid2"><div class="card"><h3>การนิเทศรายเดือน (6 เดือนล่าสุด)</h3>${monthSVG(mk)}</div>

/* ---------- ส่วนประกอบรายงาน (กราฟ/กำลังใจ/ลายมือชื่อ) ---------- */
function f1(x) { return x.toFixed(1); }
function radarSVG(sc) {
  const cx = 170, cy = 150, R = 100, n = sc.length || 8, ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const P = (i, v) => [cx + R * v / 4 * Math.cos(ang(i)), cy + R * v / 4 * Math.sin(ang(i))];
  const ring = v => `<polygon points="${sc.map((_, i) => P(i, v).map(f1).join(',')).join(' ')}" fill="none" stroke="#c5d4d7"/>`;
  const lab = sc.map((_, i) => { const [x, y] = P(i, 4.6); return `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#0a3f4c">${i + 1}</text>`; }).join('');
  const ax = sc.map((_, i) => { const [x, y] = P(i, 4); return `<line x1="${cx}" y1="${cy}" x2="${f1(x)}" y2="${f1(y)}" stroke="#d3dfe1"/>`; }).join('');
  const pts = sc.map((v, i) => P(i, v || 0));
  return `<svg viewBox="0 0 340 300" role="img" aria-label="กราฟเรดาร์คะแนนรายข้อ" style="width:100%;max-width:340px;display:block;margin:auto">${[1,2,3,4].map(ring).join('')}${ax}
   <polygon points="${pts.map(a => a.map(f1).join(',')).join(' ')}" fill="#0e5a6b" fill-opacity=".25" stroke="#0e5a6b" stroke-width="2.5"/>
   ${pts.map(a => `<circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="4" fill="#e8a317" stroke="#0a3f4c"/>`).join('')}${lab}</svg>`;
}
function trendSVG(pts) {
  const W = 420, H = 160, l = 34, rr = 34, t = 20, b = 30, n = pts.length;
  const X = i => l + (n === 1 ? (W - l - rr) / 2 : i * (W - l - rr) / (n - 1)), Y = v => t + (4 - v) / 3 * (H - t - b);
  const grid = [1,2,3,4].map(v => `<line x1="${l}" x2="${W - rr}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="#d3dfe1"/><text x="${l - 8}" y="${f1(Y(v))}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#5b727a">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟพัฒนาการคะแนนเฉลี่ย" style="width:100%">${grid}
   <polyline points="${pts.map((p, i) => f1(X(i)) + ',' + f1(Y(p.a))).join(' ')}" fill="none" stroke="#0e5a6b" stroke-width="3" stroke-linejoin="round"/>
   ${pts.map((p, i) => `<circle cx="${f1(X(i))}" cy="${f1(Y(p.a))}" r="5" fill="#e8a317" stroke="#0a3f4c" stroke-width="1.5"/><text x="${f1(X(i))}" y="${f1(Y(p.a) - 10)}" text-anchor="middle" font-size="11" font-weight="700" fill="#0a3f4c">${p.a.toFixed(2)}</text><text x="${f1(X(i))}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5b727a">${esc(fd(p.d))}</text>`).join('')}</svg>`;
}
const barOf = v => `<div class="bar" style="height:12px"><i style="width:${v / 4 * 100}%;background:${v >= 3 ? 'var(--ok)' : v === 2 ? 'var(--sun)' : 'var(--bad)'}"></i></div>`;
function cheer(a) {
  return a >= 3.5 ? ['🌟', 'ยอดเยี่ยมมาก! การจัดการเรียนรู้ของคุณครูเป็นแบบอย่างที่ดี ขอบคุณที่ทุ่มเทเพื่อผู้เรียนเสมอมา']

function initPads(r = {}) {

    const k = c.dataset.k; let down = false;
    const pt = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * c.width / b.width, (e.clientY - b.top) * c.height / b.height]; };
    if (r.sig && r.sig[k]) { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, c.width, c.height); c.dataset.has = '1'; }; im.src = r.sig[k]; }
    c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); down = true; const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); g.lineTo(x + .1, y + .1); g.stroke(); c.dataset.has = '1'; });
    c.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pt(e); g.lineTo(x, y); g.stroke(); });
    ['pointerup', 'pointercancel'].forEach(t => c.addEventListener(t, () => { down = false; }));
  });
}

    const r = {...old, id: f.get('id') || undefined, tuid: t.id, teacher: t.name, school: t.school, date: f.get('date'), subject: f.get('subject'), grade: f.get('grade'), topic: f.get('topic'),
      preGoal: f.get('preGoal'), preFocus: f.get('preFocus'), preNeed: f.get('preNeed'),
      scores, _avg: c.avg, obsNotes: RUBRIC.map((_, i) => (f.get('o' + i) || '').trim()), refNotes: RUBRIC.map((_, i) => (f.get('c' + i) || '').trim()), strengths: f.get('strengths'), goal: f.get('goal'), reality: f.get('reality'), options: f.get('options'), will: f.get('will'), next: f.get('next'), ret: f.get('ret') === '1'};
    const sig = {}; form.querySelectorAll('canvas.pad').forEach(c => { if (c.dataset.has === '1') sig[c.dataset.k] = c.toDataURL('image/png'); });
    r.sig = sig; r.supName = SUP_NAME; r.headName = (f.get('headName') || '').trim();
    if (JSON.stringify(r).length > 45000) return toast('ลายมือชื่อมีขนาดใหญ่เกินไป กรุณาล้างแล้วเซ็นใหม่ให้เส้นสั้นลง', true);
    if (await run(() => save('obs', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  // ศน. สร้าง/แก้ไขนัดเอง
  sched: async f => {
    const t = find('roster', f.get('tuid')), old = find('sched', f.get('id')) || {};
    if (!t) return toast('กรุณาเลือกครู', true);
    const r = {...old, id: f.get('id') || undefined, tuid: t.id, teacher: t.name, school: t.school, date: f.get('date'), time: f.get('time'), dur: +f.get('dur'), mode: f.get('mode'),
      meet: (f.get('meet') || '').trim(), place: f.get('place'), topic: f.get('topic'), supNote: f.get('supNote'), status: f.get('status'), by: old.by || 'sup', seenT: false};
    if (r.meet && !okMeet(r.meet)) return toast('ลิงก์ต้องขึ้นต้นด้วย https://meet.google.com/', true);
    if (r.mode === 'online' && isConf(r) && !r.meet) return toast('กรุณาใส่ลิงก์ Google Meet สำหรับนัดออนไลน์', true);
    if (SCH_ACTIVE(r) && conflicts(r).length && !confirm('วันเวลานี้ตรงกับนัดอื่นที่มีอยู่แล้ว ต้องการบันทึกต่อหรือไม่?')) return;
    if (await run(() => save('sched', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  // ครูส่งคำขอรับการโค้ช
  req: async f => {
    const old = find('sched', f.get('id')) || {};
    const r = {...old, id: f.get('id') || undefined, tuid: S.uid, teacher: S.name, school: old.school || myRoster().school || '', date: f.get('date'), time: f.get('time'), dur: +f.get('dur'),
      mode: f.get('mode'), topic: (f.get('topic') || '').trim(), note: f.get('note'), status: 'รอยืนยัน', by: 'teacher', reqDate: f.get('date'), reqTime: f.get('time'),
      reqAt: new Date().toISOString(), seenT: true, cancelBy: ''};
    if (r.date < today()) return toast('วันที่เลือกผ่านมาแล้ว กรุณาเลือกวันใหม่', true);
    if (conflicts(r).length) return toast('วันเวลาที่เลือกตรงกับนัดที่มีอยู่แล้ว กรุณาเปลี่ยนวันหรือเวลา', true);
    if (await run(() => save('sched', r), 'ส่งคำขอแล้ว รอ ศน. ยืนยัน')) { dlg.close(); tab = 'sched'; render(); }
  },
  // ศน. ยืนยัน / เลื่อนนัด / ปฏิเสธ
  rev: async (f, form, sub) => {
    const r = find('sched', f.get('id')); if (!r) return;
    const supNote = f.get('supNote');
    if (sub && sub.value === 'no') {
      if (!confirm('ปฏิเสธคำขอนี้? ครูจะได้รับแจ้งเตือน')) return;
      return setSch(r, {status: 'ยกเลิก', cancelBy: 'sup', supNote, seenT: false, decidedAt: new Date().toISOString()}, 'ปฏิเสธคำขอแล้ว');
    }
    const n = {date: f.get('date'), time: f.get('time'), dur: +f.get('dur'), mode: f.get('mode'), meet: (f.get('meet') || '').trim(), place: f.get('place'), supNote};
    if (n.date < today()) return toast('วันที่ผ่านมาแล้ว กรุณาเลือกวันใหม่', true);
    if (n.mode === 'online' && !okMeet(n.meet)) return toast('กรุณาใส่ลิงก์ Google Meet (https://meet.google.com/...)', true);
    if (conflicts({...r, ...n}).length && !confirm('วันเวลานี้ตรงกับนัดอื่นที่มีอยู่แล้ว ต้องการยืนยันต่อหรือไม่?')) return;
    const moved = n.date !== r.date || n.time !== r.time;
    setSch(r, {...n, status: moved ? 'เลื่อนนัด' : 'ยืนยันแล้ว', seenT: false, cancelBy: '', decidedAt: new Date().toISOString()}, moved ? 'ส่งเวลาใหม่และลิงก์ให้ครูแล้ว' : 'ยืนยันนัดและส่งลิงก์ให้ครูแล้ว');
  },
  roster: async f => {
    const id = f.get('id'), school = (f.get('school') || '').trim();
    if (id) {
      const r = {...find('roster', id), id, name: f.get('name').trim(), school, subject: f.get('subject'), pin: (f.get('pin') || '').trim()};
      if (!r.pin) delete r.pin; // เว้นว่าง = ไม่เปลี่ยนรหัส (เซิร์ฟเวอร์เก็บแฮชเดิมไว้)
      if (L('roster').some(x => x.name === r.name && x.id !== r.id)) return toast('มีชื่อนี้อยู่แล้ว', true);
      if (await run(() => save('roster', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
      return;
    }
    const subs = f.getAll('subject'), pins = f.getAll('pin');
    const rows = f.getAll('name').map((n, i) => ({name: n.trim(), school, subject: (subs[i] || '').trim(), pin: (pins[i] || '').trim()})).filter(r => r.name);
    if (!rows.length) return toast('กรุณากรอกชื่อครูอย่างน้อย 1 คน', true);
    const nm = rows.map(r => r.name), dup = nm.find((n, i) => nm.indexOf(n) !== i || L('roster').some(x => x.name === n));
    if (dup) return toast('มีชื่อ “' + dup + '” อยู่แล้ว', true);
    const noSch = !L('school').some(s => s.name === school);
    if (await run(async () => { for (const r of rows) await save('roster', r); }, `เพิ่มครู ${rows.length} คนใน ${school} แล้ว` + (noSch ? ' · อย่าลืมตั้งรหัสโรงเรียนในแท็บ “รหัสโรงเรียน”' : ''))) { dlg.close(); render(); }
  },
  school: async f => {
    const r = {id: f.get('id') || undefined, name: f.get('name').trim(), pin: f.get('pin').trim()};
    if (!r.pin) delete r.pin;
    if (L('school').some(x => x.name === r.name && x.id !== r.id)) return toast('มีโรงเรียนนี้อยู่แล้ว', true);
    if (await run(() => save('school', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  plc: async f => { if (await run(() => save('plc', {title: f.get('title'), body: f.get('body'), date: today(), uid: S.uid, name: S.name, role: S.role}), 'โพสต์แล้ว')) render(); },
  cm: async f => { if (await run(() => save('plccm', {pid: f.get('pid'), text: f.get('text'), date: new Date().toISOString(), uid: S.uid, name: S.name, role: S.role}))) render(); },
  ev: async f => { if (await run(() => save(myEv(), {title: f.get('title'), type: f.get('type'), date: f.get('date'), link: f.get('link'), note: f.get('note')}), 'บันทึกแล้ว')) { dlg.close(); render(); } }
};
document.addEventListener('submit', e => { const f = e.target.dataset.f; if (!f) return; e.preventDefault(); const b = e.submitter; if (b) b.disabled = true; Promise.resolve(F[f](new FormData(e.target), e.target, b)).finally(() => { if (b) b.disabled = false; }); });

// ดึงข้อมูลใหม่ทุก 60 วินาที เพื่อแจ้งเตือนคำขอ/การยืนยันนัด (ข้ามขณะเปิดฟอร์มหรือกำลังพิมพ์)
setInterval(async () => { if (!S || dlg.open || typing() || document.hidden) return; try { await load(); render(); } catch (e) {} }, 60000);
if (S) { render(); refresh(); } else render();
</script>
</body>
</html>
